# 兜底：定时推一个空提交触发 Back4App 自动部署。
# 说明：启用固定 Cloudflare Argo 隧道后，对外域名已永久固定，
#       此兜底通常不需要；仅在隧道异常或需要强制重部署时作备用。
#       如需临时停用，注释掉下面的 schedule 段即可（保留 workflow_dispatch 手动触发）。
name: Back4App Redeploy

on:
  schedule:
    # 每 58 分钟一次（GitHub Actions 使用 UTC）
    - cron: '*/58 * * * *'
  # 手动触发
  workflow_dispatch:

# 防止多个部署任务叠加；不取消进行中的推送，避免打断 git push
concurrency:
  group: back4app-redeploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push empty commit to trigger Back4App deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: trigger Back4App redeploy $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git push
